# See: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Release Spelunk CLI

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'cmd/spelunk/v*'

jobs:
  release:
    name: Release Spelunk CLI (${{ matrix.target_os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
          - os: macos-latest
            target_os: darwin
          - os: windows-latest
            target_os: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Install ARM64 Cross Compiler
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set Release Environment
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#cmd/spelunk/}"
          echo "GORELEASER_CURRENT_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "TARGET_OS=${{ matrix.target_os }}" >> "$GITHUB_ENV"

      - name: Locate Bitwarden Static Library
        if: matrix.target_os == 'windows'
        shell: bash
        working-directory: cmd/spelunk
        run: |
          # `go list -m` reports an empty directory (and still exits 0) for a
          # module that has not been fetched yet, so download it up front.
          go mod download github.com/bitwarden/sdk-go/v2

          MODULE_DIR="$(go list -m -f '{{.Dir}}' github.com/bitwarden/sdk-go/v2 | tr '\\' '/')"
          if [ -z "${MODULE_DIR}" ]; then
            echo "::error::Could not resolve the directory of github.com/bitwarden/sdk-go/v2"
            exit 1
          fi

          LIB_DIR="${MODULE_DIR}/internal/cinterface/lib/windows-x64"
          if [ ! -f "${LIB_DIR}/libbitwarden_c.a" ]; then
            echo "::error::Bitwarden static library not found in ${LIB_DIR}"
            exit 1
          fi

          echo "BITWARDEN_LIB_DIR=${LIB_DIR}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Homebrew cask only published for macOS.
          args: release --clean --skip=validate${{ matrix.target_os != 'darwin' && ',homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT_DETRO_HOMEBREW_TAP: ${{ secrets.GH_PAT_DETRO_HOMEBREW_TAP }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
