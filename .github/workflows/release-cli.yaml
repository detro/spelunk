# See: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Release Spelunk CLI

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'cmd/spelunk/v*'

jobs:
  release:
    name: Release Spelunk CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Set Release Environment
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#cmd/spelunk/}"
          echo "GORELEASER_CURRENT_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: cmd/spelunk
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT_DETRO_HOMEBREW_TAP: ${{ secrets.GH_PAT_DETRO_HOMEBREW_TAP }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
