# See: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags:
      - 'cmd/spelunk/v*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Build + Lint + Fmt + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install asdf
        uses: asdf-vm/actions/setup@v4

      - name: Install Task
        run: |
          asdf plugin add task
          asdf install task

      - name: Install (rest of the) Tools
        run: task tools.install

      - name: Vulnerability Scan
        run: task vuln

      - name: Build
        run: task build

      - name: Check for Linting or Formatting issues
        run: |
          task lint-fix
          task fmt
          git diff --exit-code

      - name: Test with Coverage report
        env:
          SPELUNK_1PASSWORD_TEST_SATOKEN: ${{ secrets.SPELUNK_1PASSWORD_TEST_SATOKEN }}
        run: |
          task test.ci
          go tool cover -func=coverage.out > coverage.txt
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=cmd/spelunk/coverage.out > cmd/spelunk/coverage.txt
          echo "## Test Coverage Report (cmd/spelunk)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cmd/spelunk/coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  release:
    name: Release Spelunk CLI
    needs: test
    if: startsWith(github.ref, 'refs/tags/cmd/spelunk/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install asdf
        uses: asdf-vm/actions/setup@v4

      - name: Install Task
        run: |
          asdf plugin add task
          asdf install task

      - name: Install Tools
        run: task tools.install

      - name: Install Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build Release Binary via Task
        run: task cli:build-release

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
