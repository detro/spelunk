# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: spelunk

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: spelunk-darwin
    skip: '{{ ne .Env.TARGET_OS "darwin" }}'
    dir: cmd/spelunk
    main: .
    binary: spelunk
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.name={{.ProjectName}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.version={{.Version}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.commit={{.ShortCommit}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.branch={{.Branch}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.date={{.Date}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.builtBy=goreleaser'

  - id: spelunk-linux
    skip: '{{ ne .Env.TARGET_OS "linux" }}'
    dir: cmd/spelunk
    main: .
    binary: spelunk
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - CC_linux_amd64=gcc
      - CC_linux_arm64=aarch64-linux-gnu-gcc
      - CC={{ index .Env (print "CC_" .Os "_" .Arch) }}
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.name={{.ProjectName}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.version={{.Version}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.commit={{.ShortCommit}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.branch={{.Branch}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.date={{.Date}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.builtBy=goreleaser'

  - id: spelunk-windows
    skip: '{{ ne .Env.TARGET_OS "windows" }}'
    dir: cmd/spelunk
    main: .
    binary: spelunk
    # Guard against silently regressing to a dynamically linked Bitwarden SDK:
    # a `bitwarden_c.dll` entry in the PE import table means the executable
    # cannot start on a machine that does not have that DLL, which is every
    # machine. Runs before archiving, so a bad binary is never published. The
    # string only ever comes from the DLL import stub, never from the static
    # archive, which makes a plain byte scan a reliable check.
    hooks:
      post:
        - output: true
          cmd: >-
            powershell -NoProfile -Command '
            $exe = "{{ .Path }}";
            $pe = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe));
            if ($pe.Contains("bitwarden_c.dll")) {
            throw "$exe imports bitwarden_c.dll: the Bitwarden SDK was linked dynamically and the binary will not start"
            };
            Write-Host "OK: $exe does not import bitwarden_c.dll"'
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      # The Bitwarden SDK ships both a static archive and a DLL import stub for
      # Windows, and `-lbitwarden_c` makes the linker prefer the stub. That
      # produces an executable importing `bitwarden_c.dll`, which is published
      # nowhere, so it dies on startup with STATUS_DLL_NOT_FOUND. Requesting the
      # archive by exact filename forces the static link. These flags land
      # before the SDK's own `#cgo LDFLAGS`, so the symbols are already resolved
      # by the time `-lbitwarden_c` is considered and the stub is never used.
      # BITWARDEN_LIB_DIR is exported by the release workflow; an unset value
      # fails the build loudly rather than silently reverting to a broken link.
      - CGO_LDFLAGS=-L{{ .Env.BITWARDEN_LIB_DIR }} -l:libbitwarden_c.a
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.name={{.ProjectName}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.version={{.Version}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.commit={{.ShortCommit}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.branch={{.Branch}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.date={{.Date}}'
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.builtBy=goreleaser'

source:
  enabled: false

archives:
  - wrap_in_directory: true
    files:
      - README*
      - CHANGELOG*
      - LICENSE*
    formats: ["tgz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

sboms:
  - artifacts: archive

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Env.TARGET_OS }}_checksums.txt"
  algorithm: sha512

signs:
  - id: cosign-checksums
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true
  - id: gpg-checksums
    artifacts: checksum
    cmd: gpg
    signature: "${artifact}.sig"
    args:
      - "--batch"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    output: true

changelog:
  disable: true

release:
  github:
    owner: detro
    name: spelunk
  mode: append
  draft: true
  use_existing_draft: true
  make_latest: true
  name_template: "{{ .Tag }}"

