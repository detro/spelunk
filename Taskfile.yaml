# See: https://taskfile.dev/docs/getting-started
version: '3'

output: prefixed

includes:
  cli:
    taskfile: ./cmd/spelunk
    dir: ./cmd/spelunk

env:
  GOBIN: '{{.TASKFILE_DIR}}/bin'

vars:
  # The Bitwarden plugin only builds with Go releases that predate CVE-2026-97038
  # (https://go.dev/issue/82572; upstream: https://github.com/bitwarden/sdk-sm/issues/1592),
  # so it is kept out of the Go workspace and run with an older toolchain.
  BITWARDEN_GO_ENV: GOWORK=off GOTOOLCHAIN=go1.27.3

tasks:
  generate:
    cmd: go generate ./...

  build:
    deps:
      - generate
      - cli:build
      - { task: build.module, vars: { DIR: . } }
      - { task: build.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: build.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: build.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: build.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: build.module, vars: { DIR: plugin/source/1password } }
      - { task: build.module, vars: { DIR: plugin/source/aws } }
      - { task: build.module, vars: { DIR: plugin/source/azure } }
      - { task: build.module, vars: { DIR: plugin/source/gcp } }
      - { task: build.module, vars: { DIR: plugin/source/keeper } }
      - { task: build.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: build.module, vars: { DIR: plugin/source/vault } }
      - { task: build.module, vars: { DIR: examples/basic } }
      - { task: build.module, vars: { DIR: examples/kong } }
      - { task: build.module, vars: { DIR: examples/urfave-cli } }
      - { task: build.module, vars: { DIR: examples/viper } }
      - { task: build.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  build.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'build:{{.DIR}}'
    prefix: 'build:{{.DIR}}'
    cmd: '{{.GO_ENV}} go build ./...'

  clean:
    deps:
      - cli:clean
    cmds:
      - rm -rf bin/
      - rm -f coverage.*

  test:
    deps: [test.full]

  test.short:
    cmds:
      - cmd: go test -v -race -cover -short {{.CLI_ARGS}}
        if: '[ -n "{{.CLI_ARGS}}" ]'
      - task: test.short.all
        if: '[ -z "{{.CLI_ARGS}}" ]'

  test.short.all:
    internal: true
    deps:
      - cli:test.short
      - { task: test.module, vars: { DIR: ., NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/modifier/jsonpath, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/modifier/tomlpath, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/modifier/xpath, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/modifier/yamlpath, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/1password, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/aws, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/azure, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/gcp, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/keeper, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/kubernetes, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/vault, NAME: test.short, FLAGS: '-v -race -cover -short' } }
      - { task: test.module, vars: { DIR: plugin/source/bitwarden, NAME: test.short, FLAGS: '-v -race -cover -short', GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  test.full:
    cmds:
      - cmd: go test -v -race -cover {{.CLI_ARGS}}
        if: '[ -n "{{.CLI_ARGS}}" ]'
      - task: test.full.all
        if: '[ -z "{{.CLI_ARGS}}" ]'

  test.full.all:
    internal: true
    deps:
      - cli:test.full
      - { task: test.module, vars: { DIR: ., NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/modifier/jsonpath, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/modifier/tomlpath, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/modifier/xpath, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/modifier/yamlpath, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/1password, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/aws, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/azure, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/gcp, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/keeper, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/kubernetes, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/vault, NAME: test.full, FLAGS: '-v -race -cover' } }
      - { task: test.module, vars: { DIR: plugin/source/bitwarden, NAME: test.full, FLAGS: '-v -race -cover', GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  test.ci:
    cmds:
      - cmd: go test -v -race -coverprofile=coverage.out -covermode=atomic {{.CLI_ARGS}}
        if: '[ -n "{{.CLI_ARGS}}" ]'
      - task: test.ci.all
        if: '[ -z "{{.CLI_ARGS}}" ]'

  test.ci.all:
    internal: true
    deps:
      - cli:test.ci
      - { task: test.module, vars: { DIR: ., NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/modifier/jsonpath, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/modifier/tomlpath, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/modifier/xpath, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/modifier/yamlpath, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/1password, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/aws, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/azure, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/gcp, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/keeper, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/kubernetes, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/vault, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic' } }
      - { task: test.module, vars: { DIR: plugin/source/bitwarden, NAME: test.ci, FLAGS: '-v -race -coverprofile=coverage.out -covermode=atomic', GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  test.module:
    internal: true
    dir: '{{.DIR}}'
    label: '{{.NAME}}:{{.DIR}}'
    prefix: '{{.NAME}}:{{.DIR}}'
    cmd: '{{.GO_ENV}} go test {{.FLAGS}} ./...'

  coverage.report:
    desc: Write the coverage of every module, produced by test.ci, to coverage.md
    silent: true
    cmds:
      - rm -f coverage.md
      - |
        { echo "## Test Coverage Report (root module)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd cmd/spelunk && { echo "## Test Coverage Report (cmd/spelunk)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/modifier/jsonpath && { echo "## Test Coverage Report (plugin/modifier/jsonpath)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/modifier/tomlpath && { echo "## Test Coverage Report (plugin/modifier/tomlpath)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/modifier/xpath && { echo "## Test Coverage Report (plugin/modifier/xpath)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/modifier/yamlpath && { echo "## Test Coverage Report (plugin/modifier/yamlpath)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/1password && { echo "## Test Coverage Report (plugin/source/1password)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/aws && { echo "## Test Coverage Report (plugin/source/aws)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/azure && { echo "## Test Coverage Report (plugin/source/azure)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/gcp && { echo "## Test Coverage Report (plugin/source/gcp)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/keeper && { echo "## Test Coverage Report (plugin/source/keeper)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/kubernetes && { echo "## Test Coverage Report (plugin/source/kubernetes)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/vault && { echo "## Test Coverage Report (plugin/source/vault)"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"
      - cd plugin/source/bitwarden && { echo "## Test Coverage Report (plugin/source/bitwarden)"; echo '```'; {{.BITWARDEN_GO_ENV}} go tool cover -func=coverage.out; echo '```'; } >> "{{.ROOT_DIR}}/coverage.md"

  lint:
    deps:
      - cli:lint
      - { task: lint.module, vars: { DIR: . } }
      - { task: lint.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: lint.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: lint.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: lint.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: lint.module, vars: { DIR: plugin/source/1password } }
      - { task: lint.module, vars: { DIR: plugin/source/aws } }
      - { task: lint.module, vars: { DIR: plugin/source/azure } }
      - { task: lint.module, vars: { DIR: plugin/source/gcp } }
      - { task: lint.module, vars: { DIR: plugin/source/keeper } }
      - { task: lint.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: lint.module, vars: { DIR: plugin/source/vault } }
      - { task: lint.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  lint.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'lint:{{.DIR}}'
    prefix: 'lint:{{.DIR}}'
    cmd: '{{.GO_ENV}} golangci-lint run --allow-parallel-runners --verbose'

  vuln:
    desc: Run govulncheck for vulnerability scanning
    deps:
      - cli:vuln
      - { task: vuln.module, vars: { DIR: . } }
      - { task: vuln.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: vuln.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: vuln.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: vuln.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: vuln.module, vars: { DIR: plugin/source/1password } }
      - { task: vuln.module, vars: { DIR: plugin/source/aws } }
      - { task: vuln.module, vars: { DIR: plugin/source/azure } }
      - { task: vuln.module, vars: { DIR: plugin/source/gcp } }
      - { task: vuln.module, vars: { DIR: plugin/source/keeper } }
      - { task: vuln.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: vuln.module, vars: { DIR: plugin/source/vault } }
      - { task: vuln.module, vars: { DIR: examples/basic } }
      - { task: vuln.module, vars: { DIR: examples/kong } }
      - { task: vuln.module, vars: { DIR: examples/urfave-cli } }
      - { task: vuln.module, vars: { DIR: examples/viper } }
      - { task: vuln.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  vuln.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'vuln:{{.DIR}}'
    prefix: 'vuln:{{.DIR}}'
    cmd: '{{.GO_ENV}} govulncheck ./...'

  lint-fix:
    deps:
      - cli:lint-fix
      - { task: lint-fix.module, vars: { DIR: . } }
      - { task: lint-fix.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: lint-fix.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: lint-fix.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: lint-fix.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/1password } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/aws } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/azure } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/gcp } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/keeper } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/vault } }
      - { task: lint-fix.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  lint-fix.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'lint-fix:{{.DIR}}'
    prefix: 'lint-fix:{{.DIR}}'
    cmd: '{{.GO_ENV}} golangci-lint run --fix --allow-parallel-runners --verbose'

  fmt:
    deps:
      - cli:fmt
      - { task: fmt.module, vars: { DIR: . } }
      - { task: fmt.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: fmt.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: fmt.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: fmt.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: fmt.module, vars: { DIR: plugin/source/1password } }
      - { task: fmt.module, vars: { DIR: plugin/source/aws } }
      - { task: fmt.module, vars: { DIR: plugin/source/azure } }
      - { task: fmt.module, vars: { DIR: plugin/source/gcp } }
      - { task: fmt.module, vars: { DIR: plugin/source/keeper } }
      - { task: fmt.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: fmt.module, vars: { DIR: plugin/source/vault } }
      - { task: fmt.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  fmt.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'fmt:{{.DIR}}'
    prefix: 'fmt:{{.DIR}}'
    cmd: '{{.GO_ENV}} golangci-lint fmt -v'

  run:
    cmd: go run . {{.CLI_ARGS}}

  mod.update:
    deps:
      - cli:mod.update
      - { task: mod.update.module, vars: { DIR: . } }
      - { task: mod.update.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: mod.update.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: mod.update.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: mod.update.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: mod.update.module, vars: { DIR: plugin/source/1password } }
      - { task: mod.update.module, vars: { DIR: plugin/source/aws } }
      - { task: mod.update.module, vars: { DIR: plugin/source/azure } }
      - { task: mod.update.module, vars: { DIR: plugin/source/gcp } }
      - { task: mod.update.module, vars: { DIR: plugin/source/keeper } }
      - { task: mod.update.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: mod.update.module, vars: { DIR: plugin/source/vault } }
      - { task: mod.update.module, vars: { DIR: examples/basic } }
      - { task: mod.update.module, vars: { DIR: examples/kong } }
      - { task: mod.update.module, vars: { DIR: examples/urfave-cli } }
      - { task: mod.update.module, vars: { DIR: examples/viper } }
      - { task: mod.update.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  mod.update.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'mod.update:{{.DIR}}'
    prefix: 'mod.update:{{.DIR}}'
    cmd: '{{.GO_ENV}} go get -t -u ./...'

  mod.tidy:
    deps:
      - cli:mod.tidy
      - { task: mod.tidy.module, vars: { DIR: . } }
      - { task: mod.tidy.module, vars: { DIR: plugin/modifier/jsonpath } }
      - { task: mod.tidy.module, vars: { DIR: plugin/modifier/tomlpath } }
      - { task: mod.tidy.module, vars: { DIR: plugin/modifier/xpath } }
      - { task: mod.tidy.module, vars: { DIR: plugin/modifier/yamlpath } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/1password } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/aws } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/azure } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/gcp } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/keeper } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/kubernetes } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/vault } }
      - { task: mod.tidy.module, vars: { DIR: examples/basic } }
      - { task: mod.tidy.module, vars: { DIR: examples/kong } }
      - { task: mod.tidy.module, vars: { DIR: examples/urfave-cli } }
      - { task: mod.tidy.module, vars: { DIR: examples/viper } }
      - { task: mod.tidy.module, vars: { DIR: plugin/source/bitwarden, GO_ENV: '{{.BITWARDEN_GO_ENV}}' } }

  mod.tidy.module:
    internal: true
    dir: '{{.DIR}}'
    label: 'mod.tidy:{{.DIR}}'
    prefix: 'mod.tidy:{{.DIR}}'
    cmd: '{{.GO_ENV}} go mod tidy -v'

  dependencies.update:
    cmds:
      - task: mod.update
      - task: mod.tidy

  tag:
    silent: true
    desc: Create release tags for the root module and submodules
    deps:
      - cli:tag
    cmd: |
      # Check if version was provided
      if [ -z "{{.CLI_ARGS}}" ]; then
        echo "Error: You must provide a version tag (e.g. task tag -- v2.0.0)"
        exit 1
      fi

      # Parse arguments
      set -- {{.CLI_ARGS}}
      TAG_VER="$1"
      SUBMOD_PATH="$2"

      # Validate version starts with 'v'
      if [[ ! "$TAG_VER" =~ ^v[0-9] ]]; then
        echo "Error: Version must start with 'v' followed by a number (e.g. v2.0.0), got '$TAG_VER'"
        exit 1
      fi

      if [ -n "$SUBMOD_PATH" ]; then
        # Trim leading/trailing slashes from path
        SUBMOD_PATH="${SUBMOD_PATH#/}"
        SUBMOD_PATH="${SUBMOD_PATH%/}"

        # Verify that sub-module exists and contains a go.mod
        if [ ! -f "$SUBMOD_PATH/go.mod" ]; then
          echo "Error: Submodule directory '$SUBMOD_PATH' does not exist or does not contain a go.mod file"
          exit 1
        fi

        echo "Tagging submodule '$SUBMOD_PATH' with tag: $SUBMOD_PATH/$TAG_VER"
        git tag "$SUBMOD_PATH/$TAG_VER"
      else
        echo "Tagging root module with tag: $TAG_VER"
        git tag "$TAG_VER"

        echo "Tagging plugin submodules with tag: $TAG_VER"
        git tag "plugin/modifier/jsonpath/$TAG_VER"
        git tag "plugin/modifier/tomlpath/$TAG_VER"
        git tag "plugin/modifier/xpath/$TAG_VER"
        git tag "plugin/modifier/yamlpath/$TAG_VER"
        git tag "plugin/source/1password/$TAG_VER"
        git tag "plugin/source/aws/$TAG_VER"
        git tag "plugin/source/azure/$TAG_VER"
        git tag "plugin/source/bitwarden/$TAG_VER"
        git tag "plugin/source/gcp/$TAG_VER"
        git tag "plugin/source/keeper/$TAG_VER"
        git tag "plugin/source/kubernetes/$TAG_VER"
        git tag "plugin/source/vault/$TAG_VER"
      fi

      echo "Tags created successfully."

  tag.push:
    silent: true
    desc: Create all release tags (via `task tag`) and push them, pushing cmd/spelunk's tag last and on its own
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Error: You must provide a version tag (e.g. task tag.push -- v2.0.0)"
          exit 1
        fi
        set -- {{.CLI_ARGS}}
        if [ "$#" -ne 1 ]; then
          echo "Error: tag.push releases the whole workspace and only takes a version (e.g. task tag.push -- v2.0.0)"
          exit 1
        fi
      - task: tag
      - |
        # GitHub Actions does not fire `push` events for tags when more than 3
        # tags are pushed in a single `git push`. release-cli.yaml only listens
        # for `cmd/spelunk/v*` tags, so that tag must be pushed alone, in its
        # own push, or the release workflow silently never runs.
        # See: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#push
        TAG_VER="{{.CLI_ARGS}}"
        CLI_TAG="cmd/spelunk/$TAG_VER"
        OTHER_TAGS=$(git tag -l "$TAG_VER" "*/$TAG_VER" | grep -vFx "$CLI_TAG")

        echo "Pushing all tags for $TAG_VER, except '$CLI_TAG'..."
        echo "$OTHER_TAGS" | xargs git push origin

        echo "Pushing '$CLI_TAG' on its own, to trigger its release workflow..."
        git push origin "$CLI_TAG"

        echo "All tags for $TAG_VER pushed successfully."

  tools.plugins:
    silent: true
    desc: Install all necessary asdf plugins
    cmds:
      # Will fail but continue if the plugin is already installed
      - asdf plugin add task || true
      - asdf plugin add golang || true
      - asdf plugin add golangci-lint || true
      - asdf plugin add goreleaser || true
      - asdf plugin add govulncheck https://github.com/wizzardich/asdf-govulncheck.git || true

  tools.update:
    silent: true
    desc: Update all tools in .tool-versions to latest available versions via asdf
    deps:
      - tools.plugins
    cmds:
      - asdf set task latest
      - asdf set golang latest
      - asdf set golangci-lint latest
      - asdf set govulncheck latest
      - asdf set goreleaser latest

  tools.install:
    desc: Install all tools in .tool-versions via asdf
    deps:
      - tools.plugins
    cmd: asdf install

  doc.serve:
    cmds:
      - go install golang.org/x/pkgsite/cmd/pkgsite@latest
      - echo "Opening http://localhost:8080/github.com/detro/spelunk/v2"
      - sleep 2 && open http://localhost:8080/github.com/detro/spelunk/v2 &
      - bin/pkgsite
