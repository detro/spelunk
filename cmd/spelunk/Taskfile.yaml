# See: https://taskfile.dev/docs/getting-started
version: '3'

env:
  GOBIN: '{{.TASKFILE_DIR}}/bin'

vars:
  BUILD_NAME: spelunk
  CASK_FILE: '{{.TASKFILE_DIR}}/dist/homebrew/Casks/spelunk.rb'
  CASK_TAP: spelunk-dev/local
  BUILD_VERSION:
    sh: ver=$(git tag --points-at HEAD | grep -E '^cmd/spelunk/v' | sed 's|^cmd/spelunk/v||' | head -n 1); if [ -z "$ver" ]; then ver=$(git tag --points-at HEAD | grep -E '^v' | sed 's|^v||' | head -n 1); fi; echo ${ver:-"no-version"}
  BUILD_COMMIT:
    sh: git log -n 1 --format=%h 2>/dev/null || echo "n/a"
  BUILD_BRANCH:
    sh: ver=$(git branch --show-current 2>/dev/null); echo ${ver:-"no-branch"}
  BUILD_DATE:
    sh: date -Iseconds

tasks:
  generate:
    cmd: go generate .

  build:
    desc: Build the spelunk CLI
    vars:
      NAME:
        ref: .BUILD_NAME
      VERSION:
        ref: .BUILD_VERSION
      COMMIT:
        ref: .BUILD_COMMIT
      BRANCH:
        ref: .BUILD_BRANCH
      DATE:
        ref: .BUILD_DATE
    deps:
      - generate
    cmd: >-
      go build -o ${GOBIN}/spelunk {{.BUILD_FLAGS}} -ldflags="{{.LD_FLAGS}} \
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.name={{.NAME}}' \
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.version={{.VERSION}}' \
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.commit={{.COMMIT}}' \
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.branch={{.BRANCH}}' \
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.date={{.DATE}}' \
        -X 'github.com/detro/spelunk/cmd/spelunk/internal/cli.builtBy=taskfile.dev' \
      " .

  build-release:
    desc: Build the spelunk CLI for release (trimmed and stripped)
    cmds:
      - task: build
        vars:
          BUILD_FLAGS: -trimpath
          LD_FLAGS: -s -w

  clean:
    cmds:
      - rm -rf bin/
      - rm -rf dist/
      - rm -rf .release-extras/
      - rm -f coverage.*

  test:
    desc: Run all tests for the spelunk CLI (alias for test.full)
    deps:
      - test.full

  test.short:
    desc: Run short tests for the spelunk CLI (skips integration tests)
    cmd: |
      {{if .CLI_ARGS}}
      go test -v -race -cover -short {{.CLI_ARGS}}
      {{else}}
      go test -v -race -cover -short ./...
      {{end}}

  test.full:
    desc: Run all tests for the spelunk CLI with race detection and coverage
    cmd: |
      {{if .CLI_ARGS}}
      go test -v -race -cover {{.CLI_ARGS}}
      {{else}}
      go test -v -race -cover ./...
      {{end}}

  test.ci:
    desc: Run tests with coverage profile for CI for the spelunk CLI
    cmd: |
      {{if .CLI_ARGS}}
      go test -v -race -coverprofile=coverage.out -covermode=atomic {{.CLI_ARGS}}
      {{else}}
      go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      {{end}}

  test.goreleaser:
    desc: Build a full release of the spelunk CLI locally (no sign, sbom, publish)
    cmd: |
      set -e

      # Release tags are prefixed (`cmd/spelunk/vX.Y.Z`) but a version must not
      # contain slashes, so strip the prefix exactly like the release workflow.
      TAG="$(git describe --tags --match 'cmd/spelunk/v*' --abbrev=0 2>/dev/null || echo 'cmd/spelunk/v0.0.0')"
      export GORELEASER_CURRENT_TAG="${TAG#cmd/spelunk/}"
      goreleaser release --snapshot --clean --skip=sign,sbom,publish {{.CLI_ARGS}}

  cask.tap:
    internal: true
    # NOTE: Homebrew refuses casks outside a tap, so we need to create a scratch one to be able to run `lint.cask`
    desc: Copy the generated cask into a scratch local tap
    cmd: |
      set -e

      if [ ! -f "{{.CASK_FILE}}" ]; then
        echo "Error: {{.CASK_FILE}} not found. Run 'task cli:test.goreleaser' first."
        exit 1
      fi

      TAP_DIR="$(brew --repository {{.CASK_TAP}})"
      [ -d "$TAP_DIR" ] || brew tap-new {{.CASK_TAP}} --no-git >/dev/null
      mkdir -p "$TAP_DIR/Casks"
      cp "{{.CASK_FILE}}" "$TAP_DIR/Casks/spelunk.rb"

  lint.cask:
    desc: Lint the Homebrew cask produced by `task cli:test.goreleaser`
    deps:
      - cask.tap
    cmd: |
      # Audit runs offline: a snapshot points at release URLs that do not exist.
      brew audit --cask --strict {{.CASK_TAP}}/spelunk
      # Style offences are all cosmetic and come from GoReleaser's own cask
      # template, so they are reported but do not fail the task.
      brew style --cask {{.CASK_TAP}}/spelunk || true

  lint:
    desc: Lint the spelunk CLI
    cmd: golangci-lint run --allow-parallel-runners --verbose

  lint-fix:
    desc: Fix linter issues in the spelunk CLI
    cmd: golangci-lint run --fix --allow-parallel-runners --verbose

  fmt:
    desc: Format the spelunk CLI code
    cmd: golangci-lint fmt -v

  vuln:
    desc: Run govulncheck for vulnerability scanning in spelunk CLI
    cmd: govulncheck ./...

  mod.update:
    desc: Update dependencies for spelunk CLI
    cmd: go get -t -u ./...

  mod.tidy:
    desc: Tidy Go module for spelunk CLI
    cmd: go mod tidy -v

  dependencies.update:
    desc: Update and tidy dependencies for spelunk CLI
    deps:
      - mod.update
      - mod.tidy

  tag:
    silent: true
    desc: Create release tag for the spelunk CLI submodule
    cmd: |
      # Check if version was provided
      if [ -z "{{.CLI_ARGS}}" ]; then
        echo "Error: You must provide a version tag (e.g. task tag -- v2.0.0)"
        exit 1
      fi

      TAG_VER="{{.CLI_ARGS}}"
      # Validate version starts with 'v'
      if [[ ! "$TAG_VER" =~ ^v[0-9] ]]; then
        echo "Error: Version must start with 'v' followed by a number (e.g. v2.0.0), got '$TAG_VER'"
        exit 1
      fi

      echo "Tagging spelunk CLI with tag: cmd/spelunk/$TAG_VER"
      git tag "cmd/spelunk/$TAG_VER"
      echo "Tag created successfully. To push tag, run: git push origin cmd/spelunk/$TAG_VER"
